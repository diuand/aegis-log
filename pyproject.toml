[project]
name = "aegis-log"
version = "0.1.0"
description = "Small log-enrichment service for a risk and damage management lab"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Register rows are long prose cells; wrapping them would hurt review diffs.
"scripts/build_register.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
markers = [
    "seeded_bug(id): regression test for a deliberately seeded bug (see tests/bug_ledger.py)",
]
